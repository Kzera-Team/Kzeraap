<section class="ifissue" data-registro-row data-registro-id="{{id}}" data-tipo="financeiro">
  <div class="ifrow">
    <div>
      <div class="iftitle">{{titulo}}</div>
      <div class="ifmeta">{{meta}}</div>
    </div>
    <span class="ifbadge {{badgeClass}}">{{status}}</span>
  </div>
  <div class="ifbar-inner">
    <input type="text" class="ifinput" data-input-vincular-txn placeholder="ID staging transação" />
    <button class="ifsecondary" data-vincular-financeiro-registro data-registro-id="{{id}}" {{disabled}}>Vincular</button>
    <button class="ifsecondary" data-ignorar-registro data-registro-id="{{id}}" data-tipo="financeiro" {{disabled}}>Ignorar</button>
    <button class="ifsecondary" data-marcar-revisao-registro data-registro-id="{{id}}" data-tipo="financeiro">Revisão</button>
  </div>
</section>
