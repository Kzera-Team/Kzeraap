<article class="kzera-card code-rule-block" data-code-block="{{index}}">
  <header><strong>Bloco {{number}}</strong><button class="icon-button" type="button" data-code-remove="{{index}}" aria-label="Remover bloco" title="Remover bloco">×</button></header>
  <label><span>Tipo</span><select data-code-field="type">{{typeOptions}}</select></label>
  {{textField}}
  {{columnField}}
  {{extractionField}}
  <label><span>Formatação</span><select data-code-field="caseFormat">{{caseOptions}}</select></label>
  <label><span>Transformação</span><select data-code-field="transform">{{transformOptions}}</select></label>
</article>
