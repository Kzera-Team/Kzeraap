<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Venda concluída — recibo</title><style>:root{--p:#7B4DFF;--pd:#5B2ECC;--bg:#F7F3FF;--w:#fff;--t:#120B35;--m:#766BA8;--b:#DDD6EE;--g:#087A36;--gb:#DDF8E7;--gr:#A8E8BF}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:var(--t)}.app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;background:#120B35;position:sticky;top:0;z-index:10}.hamburger{display:flex;flex-direction:column;gap:4px;width:28px;height:28px;background:none;border:0;padding:2px;justify-content:center}.hamburger span{width:18px;height:2px;border-radius:2px;background:#fff}.header-title{color:#fff;font-size:16px;font-weight:800}.btn-header{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:10px;color:#fff;font-size:13px;font-weight:800;padding:6px 12px}.screen{padding:20px 16px 60px}.section{margin-bottom:22px}.section-head{font-size:13px;font-weight:900;color:var(--m);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}.card{background:#fff;border:1px solid var(--b);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(30,14,70,.06)}.hero{text-align:center;padding:24px 16px}.icon{width:64px;height:64px;border-radius:32px;background:var(--gb);border:1px solid var(--gr);color:var(--g);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:30px;font-weight:900}.title{font-size:22px;font-weight:900;letter-spacing:-.03em;margin-bottom:6px}.meta{color:var(--m);font-size:13px;font-weight:700}.sum{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:700;color:var(--m);margin-bottom:10px}.sum strong{color:var(--t)}.sum-total{border-top:1px solid var(--b);padding-top:12px;margin-top:12px;display:flex;justify-content:space-between;font-size:16px;font-weight:900}.stack{display:flex;flex-direction:column;gap:8px}.primary,.ghost{width:100%;height:54px;border-radius:16px;font-size:16px;font-weight:800}.primary{border:0;background:linear-gradient(180deg,var(--p),var(--pd));color:#fff;box-shadow:0 8px 24px rgba(91,46,204,.35)}.ghost{height:48px;border:1px solid var(--b);background:#fff;color:var(--p);font-size:14px}</style></head><body><div class="app-header"><button class="hamburger"><span></span><span></span><span></span></button><div class="header-title">Venda concluída</div><button class="btn-header">Nova</button></div><main class="screen"><section class="section"><div class="card hero"><div class="icon">✓</div><div class="title">Venda concluída</div><div class="meta">Estoque baixado e pagamento registrado.</div></div></section><section class="section"><div class="section-head">Resumo</div><div class="card"><div class="sum"><span>Perfil</span><strong>A.JD · Centro</strong></div><div class="sum"><span>Itens</span><strong>1 item</strong></div><div class="sum"><span>Pagamento</span><strong>Pix</strong></div><div class="sum-total"><span>Total</span><strong>R$ 35,00</strong></div></div></section><section class="section"><div class="section-head">Pós-venda</div><div class="card stack"><button class="primary">Gerar recibo</button><button class="ghost">Nova venda</button><button class="ghost">Copiar resumo</button><button class="ghost">Ver detalhes</button></div></section></main></body></html>
