name: Gerar ZIP Netlify

on:
  workflow_dispatch:
  push:
    branches:
      - claude/file-upload-project-22m8hs

jobs:
  build-netlify-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build
        run: npm run build

      - name: Criar ZIP pronto para Netlify Drop
        run: |
          cd dist
          zip -r ../Kzera-Netlify-Static-Deploy-${{ github.sha }}.zip .

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Kzera-Netlify-Static-Deploy
          path: Kzera-Netlify-Static-Deploy-${{ github.sha }}.zip
          if-no-files-found: error
