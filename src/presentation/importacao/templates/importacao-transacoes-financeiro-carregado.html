<section class="ifwrap">
  <div class="ifhero">
    <h1>Arquivos carregados</h1>
    <p>Confira os dois arquivos antes de preparar. Ainda não existe financeiro oficial.</p>
  </div>

  <div class="ifhead">Arquivos</div>

  <section class="ifcard">
    <div class="ifrow">
      <div>
        <div class="iftitle">Transações</div>
        <div class="ifmeta" data-nome-transacoes>—</div>
      </div>
      <span class="ifbadge ok" data-linhas-transacoes>0 linhas</span>
    </div>
  </section>

  <section class="ifcard">
    <div class="ifrow">
      <div>
        <div class="iftitle">Financeiro</div>
        <div class="ifmeta" data-nome-financeiro>—</div>
      </div>
      <span class="ifbadge ok" data-linhas-financeiro>0 linhas</span>
    </div>
  </section>

  <section class="ifcard ifgreen">
    <div class="iftitle">Pronto para preparar</div>
    <p class="ifmuted">O sistema vai ler, normalizar e colocar tudo em conferência. Nada baixa estoque.</p>
  </section>
</section>

<div class="ifbar">
  <div class="ifbar-inner">
    <button class="ifprimary" data-preparar-importacao>Preparar importação</button>
    <button class="ifsecondary" data-ir-vazio>Trocar arquivos</button>
  </div>
</div>
