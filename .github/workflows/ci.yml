# CI validation for Kzera desenvolvimento branch
# Runs automatically only for pull requests targeting desenvolvimento.
# Manual execution remains available through workflow_dispatch.
name: CI

on:
  pull_request:
    branches:
      - desenvolvimento
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-typecheck:
    name: Build, tests and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          set -o pipefail
          echo "Starting npm install with dev dependencies" | tee install.log
          echo "Node before install: $(node --version)" | tee -a install.log
          echo "NPM before install: $(npm --version)" | tee -a install.log
          echo "package-lock present:" | tee -a install.log
          ls -la package-lock.json 2>&1 | tee -a install.log || true
          npm install --include=dev 2>&1 | tee -a install.log

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log
          path: install.log

      - name: Verify build toolchain
        run: |
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "PWD: $(pwd)"
          echo "package.json version:"
          node -e "console.log(require('./package.json').version)"
          echo "vite package resolution:"
          node -e "console.log(require.resolve('vite'))"
          echo "npm bin resolution:"
          npm exec vite -- --version
          echo "node_modules/.bin contents:"
          ls -la node_modules/.bin || true

      - name: Build
        run: |
          set -o pipefail
          echo "Starting Vite build through npm exec"
          npm exec vite -- build 2>&1 | tee build.log

      - name: Tests and typecheck
        run: npm test

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
