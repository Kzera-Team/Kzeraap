name: Bloquear index.html sem PR

on:
  push:
    paths:
      - 'public/index.html'
  workflow_dispatch:

jobs:
  block-index-html-without-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/check-index-html-pr-only.mjs
