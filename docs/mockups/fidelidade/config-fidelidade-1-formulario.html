<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Config. Fidelidade — Formulário</title>
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --purple:      #7B4DFF;
  --purple-dark: #5B2ECC;
  --bg:          #F7F3FF;
  --white:       #ffffff;
  --text:        #120B35;
  --muted:       #766BA8;
  --border:      #DDD6EE;
  --danger:      #C62828;
  --danger-bg:   #FFF5F5;
  --danger-bdr:  #FFCDD2;
  --green:       #087A36;
  --green-bg:    #DDF8E7;
  --green-bdr:   #A8E8BF;
}

body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  min-height: 100vh;
  color: var(--text);
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 12px;
  background: #120B35;
  position: sticky;
  top: 0;
  z-index: 10;
}
.hamburger { display: flex; flex-direction: column; gap: 4px; width: 28px; height: 28px; background: none; border: none; padding: 2px; cursor: pointer; justify-content: center; }
.hamburger span { display: block; width: 18px; height: 2px; border-radius: 2px; background: #fff; }
.app-header h1 { color: #fff; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.btn-header {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 10px;
  color: #fff;
  font-size: 13px;
  font-weight: 800;
  font-family: inherit;
  padding: 6px 12px;
  cursor: pointer;
}

.screen { padding: 20px 16px 60px; }
.section { margin-bottom: 28px; }
.section-head { font-size: 13px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }

.card { background: var(--white); border: 1px solid var(--border); border-radius: 18px; padding: 16px; box-shadow: 0 2px 10px rgba(30,14,70,0.06); }

.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field label { display: block; font-size: 13px; font-weight: 800; color: var(--muted); margin-bottom: 6px; }
.field-input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--border); border-radius: 13px; background: var(--bg); color: var(--text); font-size: 15px; font-weight: 700; font-family: inherit; display: flex; align-items: center; }
.field-input.filled { background: var(--white); border-color: #C4BAE4; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.hint { font-size: 11px; font-weight: 700; color: #B0A8D0; margin-top: 5px; padding-left: 2px; }

.status-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.status-option { height: 40px; border-radius: 11px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); font-size: 12px; font-weight: 800; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.status-option.active-green  { background: var(--green-bg); border-color: var(--green-bdr); color: var(--green); }
.status-option.active-muted  { background: #F0EDF8; border-color: #C4BAE4; color: #4A3880; }
.status-option.active-danger { background: var(--danger-bg); border-color: var(--danger-bdr); color: var(--danger); }

.prize-card { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
.prize-card:last-of-type { margin-bottom: 0; }
.prize-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.prize-step-badge { font-size: 12px; font-weight: 900; color: #8B6B2A; background: #FFF3CC; border: 1px solid #DDB84A; border-radius: 8px; padding: 3px 10px; }
.btn-remove { background: none; border: none; color: #B0A8D0; font-size: 18px; cursor: pointer; line-height: 1; padding: 0 4px; }

.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.toggle-label { font-size: 13px; font-weight: 700; color: var(--muted); }
.toggle { width: 42px; height: 24px; border-radius: 12px; background: var(--green-bg); border: 1px solid var(--green-bdr); position: relative; cursor: pointer; flex-shrink: 0; }
.toggle::after { content: ''; position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--green); }
.toggle.off { background: #F0EDF8; border-color: var(--border); }
.toggle.off::after { right: auto; left: 3px; background: #C4BAE4; }

.btn-add { width: 100%; height: 46px; border-radius: 13px; border: 1px dashed #C4BAE4; background: transparent; color: var(--purple); font-size: 14px; font-weight: 800; font-family: inherit; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }

.actions-bar { display: flex; flex-direction: column; gap: 8px; }
.btn-primary { width: 100%; height: 54px; border-radius: 16px; border: none; background: linear-gradient(180deg, var(--purple) 0%, var(--purple-dark) 100%); color: #fff; font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer; box-shadow: 0 8px 24px rgba(91,46,204,0.35); }
.btn-danger { width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--danger-bdr); background: var(--white); color: var(--danger); font-size: 14px; font-weight: 800; font-family: inherit; cursor: pointer; }

</style>
</head>
<body>

<div class="app-header">
  <button class="hamburger"><span></span><span></span><span></span></button>
  <h1>Config. Fidelidade</h1>
  <button class="btn-header">Salvar</button>
</div>

<div class="screen">

  <div class="section">
    <div class="section-head">Identificação</div>
    <div class="card">
      <div class="field">
        <label>Nome da regra</label>
        <div class="field-input filled">Fidelidade Padrão 2026</div>
      </div>
      <div class="field">
        <label>Status</label>
        <div class="status-selector">
          <button class="status-option active-green">Ativa</button>
          <button class="status-option active-muted">Inativa</button>
          <button class="status-option active-danger">Arquivada</button>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">Parâmetros</div>
    <div class="card">
      <div class="field">
        <label>Quantidade de passos do cartão</label>
        <div class="field-input filled">10</div>
      </div>
      <div class="field">
        <label>Período válido</label>
        <div class="field-row">
          <div>
            <div class="field-input filled">01/01/2026</div>
            <div class="hint">Início</div>
          </div>
          <div>
            <div class="field-input" style="color:#B0A8D0;">—</div>
            <div class="hint">Fim (opcional)</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">Regra de passo</div>
    <div class="card">
      <div class="field">
        <label>Item</label>
        <div class="field-input filled">IT-0042 · Batom</div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Quantidade</label>
          <div class="field-input filled">1</div>
        </div>
        <div class="field">
          <label>Unidade</label>
          <div class="field-input filled">un</div>
        </div>
      </div>
      <div class="field" style="margin-top:10px;">
        <label>Passos gerados</label>
        <div class="field-input filled">1</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">Prêmios por passo</div>
    <div class="card">

      <div class="prize-card">
        <div class="prize-card-header">
          <span class="prize-step-badge">Passo 3</span>
          <button class="btn-remove">×</button>
        </div>
        <div class="field">
          <label>Descrição</label>
          <div class="field-input filled">Desconto 10%</div>
        </div>
        <div class="field">
          <label>Item do prêmio</label>
          <div class="field-input filled">IT-0098 · Cupom desc. 10%</div>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Ativo</span>
          <div class="toggle"></div>
        </div>
      </div>

      <div class="prize-card">
        <div class="prize-card-header">
          <span class="prize-step-badge">Passo 10</span>
          <button class="btn-remove">×</button>
        </div>
        <div class="field">
          <label>Descrição</label>
          <div class="field-input filled">Brinde Especial</div>
        </div>
        <div class="field">
          <label>Item do prêmio</label>
          <div class="field-input filled">IT-0112 · Kit brinde</div>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Ativo</span>
          <div class="toggle off"></div>
        </div>
      </div>

      <button class="btn-add">+ Adicionar prêmio</button>
    </div>
  </div>

  <div class="section" style="margin-bottom:0;">
    <div class="actions-bar">
      <button class="btn-primary">Salvar regra</button>
      <button class="btn-danger">Arquivar regra</button>
    </div>
  </div>

</div>
</body>
</html>
