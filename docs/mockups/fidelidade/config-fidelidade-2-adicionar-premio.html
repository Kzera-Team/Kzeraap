<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Config. Fidelidade — Adicionar prêmio</title>
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { overflow: hidden; height: 100%; }

:root {
  --purple:      #7B4DFF;
  --purple-dark: #5B2ECC;
  --bg:          #F7F3FF;
  --white:       #ffffff;
  --text:        #120B35;
  --muted:       #766BA8;
  --border:      #DDD6EE;
  --green:       #087A36;
  --green-bg:    #DDF8E7;
  --green-bdr:   #A8E8BF;
}

body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  max-width: 414px;
  margin: 0 auto;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  color: var(--text);
  position: relative;
}

.bg-content {
  padding: 0 0 300px;
  opacity: 0.35;
  pointer-events: none;
  filter: blur(1px);
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 12px;
  background: #120B35;
}
.hamburger { display: flex; flex-direction: column; gap: 4px; width: 28px; height: 28px; background: none; border: none; padding: 2px; cursor: pointer; justify-content: center; }
.hamburger span { display: block; width: 18px; height: 2px; border-radius: 2px; background: #fff; }
.app-header h1 { color: #fff; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.btn-header { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22); border-radius: 10px; color: #fff; font-size: 13px; font-weight: 800; font-family: inherit; padding: 6px 12px; cursor: pointer; }

.bg-screen { padding: 20px 16px; }
.bg-section { margin-bottom: 24px; }
.bg-section-head { font-size: 13px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
.bg-card { background: var(--white); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
.bg-field { margin-bottom: 12px; }
.bg-field label { display: block; font-size: 13px; font-weight: 800; color: var(--muted); margin-bottom: 6px; }
.bg-input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid #C4BAE4; border-radius: 13px; background: var(--white); color: var(--text); font-size: 15px; font-weight: 700; font-family: inherit; display: flex; align-items: center; }

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(8,4,22,0.5);
  z-index: 20;
}

.bottom-sheet {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 414px;
  background: var(--bg);
  border-radius: 28px 28px 0 0;
  padding: 12px 16px 40px;
  box-shadow: 0 -12px 48px rgba(18,8,45,0.3);
  z-index: 30;
}

.sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: #C4BAE4; margin: 0 auto 20px; }
.sheet-title { color: var(--text); font-size: 20px; font-weight: 900; letter-spacing: -0.3px; margin-bottom: 4px; }
.sheet-sub { color: var(--muted); font-size: 13px; font-weight: 700; margin-bottom: 20px; line-height: 1.4; }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 800; color: var(--muted); margin-bottom: 6px; }
.field-input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--border); border-radius: 13px; background: var(--white); color: var(--text); font-size: 15px; font-weight: 700; font-family: inherit; display: flex; align-items: center; }
.field-input.filled { border-color: #C4BAE4; }
.field-input.empty { color: #B0A8D0; }
.hint { font-size: 11px; font-weight: 700; color: #B0A8D0; margin-top: 5px; padding-left: 2px; }

.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
.toggle-label { font-size: 13px; font-weight: 700; color: var(--muted); }
.toggle { width: 42px; height: 24px; border-radius: 12px; background: var(--green-bg); border: 1px solid var(--green-bdr); position: relative; cursor: pointer; flex-shrink: 0; }
.toggle::after { content: ''; position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--green); }

.btn-primary { width: 100%; height: 54px; border-radius: 16px; border: none; background: linear-gradient(180deg, var(--purple) 0%, var(--purple-dark) 100%); color: #fff; font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer; box-shadow: 0 8px 24px rgba(91,46,204,0.35); margin-bottom: 8px; }
.btn-cancel { width: 100%; height: 44px; border: none; background: transparent; color: var(--purple); font-size: 14px; font-weight: 800; font-family: inherit; cursor: pointer; }

</style>
</head>
<body>

<div class="bg-content">
  <div class="app-header">
    <button class="hamburger"><span></span><span></span><span></span></button>
    <h1>Config. Fidelidade</h1>
    <button class="btn-header">Salvar</button>
  </div>
  <div class="bg-screen">
    <div class="bg-section">
      <div class="bg-section-head">Prêmios por passo</div>
      <div class="bg-card">
        <div class="bg-field">
          <label>Passo 3 · Desconto 10%</label>
          <div class="bg-input">IT-0098 · Cupom desc. 10%</div>
        </div>
        <div class="bg-field" style="margin-bottom:0;">
          <label>Passo 10 · Brinde Especial</label>
          <div class="bg-input">IT-0112 · Kit brinde</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay"></div>

<div class="bottom-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Adicionar prêmio</div>
  <div class="sheet-sub">Passo deve estar entre 1 e o total de passos do cartão</div>

  <div class="field">
    <label>Passo</label>
    <div class="field-input filled">5</div>
    <div class="hint">1 ≤ passo ≤ 10</div>
  </div>

  <div class="field">
    <label>Descrição</label>
    <div class="field-input filled">Desconto 15%</div>
  </div>

  <div class="field">
    <label>Item do prêmio</label>
    <div class="field-input empty">Buscar item...</div>
    <div class="hint">Apenas itens marcados como prêmio de fidelidade</div>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Ativo ao salvar</span>
    <div class="toggle"></div>
  </div>

  <button class="btn-primary">Adicionar</button>
  <button class="btn-cancel">Cancelar</button>
</div>

</body>
</html>
