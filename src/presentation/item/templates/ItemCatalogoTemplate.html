<section class="kzera-screen kzera-module-screen item-catalogo-ux" data-testid="item-catalogo-app">
  <header class="kzera-operational-header item-header" data-testid="item-header">
    <div class="kzera-operational-title"><span class="eyebrow">Catálogo</span><h1>Itens</h1><p class="form-hint">Procure primeiro. Cadastre só se não encontrar.</p></div>
    <div class="kzera-operational-actions">
      <button class="icon-button" type="button" data-action="novo-item" aria-label="Novo item" title="Novo item">+ Item</button>
    </div>
    <strong class="item-toast-loading" data-testid="item-loading" hidden>Carregando...</strong>
    <strong class="item-toast-success" data-testid="item-mensagem" hidden></strong>
    <strong class="item-toast-error" data-testid="item-erro" hidden></strong>
  </header>

  <div data-item-list-panel>
    <section class="operational-search-card">
      <input id="item-busca" placeholder="Buscar item pelo nome" />
      <button class="icon-button" type="button" data-action="buscar" aria-label="Buscar" title="Buscar">🔍</button>
    </section>

    <nav class="item-tabs module-tabs" data-testid="item-module-tabs" aria-label="Itens">
      <button type="button" class="active" data-item-view-tab="lista">Lista</button>
      <button type="button" data-item-view-tab="resumo">Resumo</button>
    </nav>

    <section class="kzera-card" data-testid="item-lista" data-item-view-panel="lista">
      <div class="kzera-section-title compact-title">
        <div><span class="eyebrow">Lista</span><h2>Itens cadastrados</h2><p class="form-hint">Mostrando 80 itens para proteger o iPhone.</p></div>
        <button class="icon-button text-icon" type="button" data-action="exportar" aria-label="Salvar lista de itens" title="Salvar lista de itens">⇩ Salvar lista</button>
      </div>
      <div class="item-card-list kzera-card-list" data-slot="item-list"></div>
    </section>

    <section class="kzera-card" data-testid="item-dashboard" data-item-view-panel="resumo" hidden>
      <div class="kzera-section-title compact-title"><div><span class="eyebrow">Resumo</span><h2>Resumo dos itens</h2></div></div>
      <div class="item-dashboard-grid kzera-metric-grid" data-slot="dashboard"></div>
    </section>
  </div>

  <section class="kzera-card form-screen" data-item-form-panel hidden>
    <button class="icon-button text-icon" type="button" data-action="voltar-itens" aria-label="Voltar para itens" title="Voltar para itens">← Itens</button>
    <form class="item-form-card kzera-form-card" data-testid="item-form">
      <div class="kzera-section-title compact-title"><div><span class="eyebrow">Cadastro</span><h2>Novo item</h2></div></div>
      <nav class="item-tabs" data-testid="item-form-tabs" aria-label="Cadastro do item">
        <button type="button" class="active" data-item-form-tab="informacoes" aria-label="Informações" title="Informações">Informações</button>
        <button type="button" data-item-form-tab="variacoes" aria-label="Variações e estoque" title="Variações e estoque">Variações</button>
      </nav>
      <div data-item-form-tab-panel="informacoes">
        <fieldset class="item-form-section">
          <legend>Informações</legend>
          <input id="item-nome" placeholder="Nome" />
          <input id="item-categoria" placeholder="Categoria opcional" />
        </fieldset>
      </div>
      <div data-item-form-tab-panel="variacoes" hidden>
        <fieldset class="item-form-section item-variation-section">
          <legend>Variações e estoque</legend>
          <div class="item-variation-card" data-testid="item-variacao-card">
            <header class="variation-card-header"><strong>Variação inicial</strong><span class="badge badge-neutral">Unidade + estoque</span></header>
            <input id="item-variacao-nome" placeholder="Ex.: Nescafé Extra Forte" />
            <select id="item-variacao-unidade" aria-label="Unidade da variação"><option value="un">un</option><option value="g">g</option><option value="mg">mg</option><option value="ml">ml</option><option value="kg">kg</option><option value="l">l</option></select>
            <div class="item-lote-editor item-lote-grid">
              <input id="item-lote-quantidade" placeholder="Quantidade" type="number" step="0.001" />
              <input id="item-lote-valor" placeholder="Valor" type="number" step="0.01" />
              <input id="item-lote-custo" placeholder="Custo total" type="number" step="0.01" />
              <input id="item-lote-data" placeholder="Data de entrada" type="date" />
              <input id="item-lote-nome" placeholder="Nome da entrada" />
            </div>
          </div>
        </fieldset>
      </div>
      <button class="icon-button primary-icon text-icon" type="submit" aria-label="Criar item" title="Criar item">Criar item</button>
    </form>
  </section>
  <template data-lote-detail-template>
    <section class="kzera-screen lote-detail-screen" data-testid="lote-detail-screen">
      <header class="kzera-operational-header"><div class="kzera-operational-title"><span class="eyebrow">Estoque</span><h1>Controle do estoque</h1></div></header>
      <section class="kzera-card">Resumo simples do estoque, separações, conferências, retirada interna e pesagem rápida.</section>
    </section>
  </template>
</section>
