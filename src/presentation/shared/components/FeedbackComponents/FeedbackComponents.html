<div id="kzera-static-components" hidden>
  <template id="kzera-loading-modal-template">
    <div class="kzera-feedback-overlay" role="status" aria-live="polite" aria-busy="true">
      <div class="kzera-feedback-card kzera-loading-card">
        <div class="kzera-loading-spinner" aria-hidden="true"></div>
        <p data-loading-message></p>
      </div>
    </div>
  </template>

  <template id="kzera-status-toast-template">
    <div class="kzera-status-toast" role="status" aria-live="polite"></div>
  </template>

</div>
