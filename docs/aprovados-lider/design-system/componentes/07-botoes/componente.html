<!-- KZERA · Botões — componente.html -->
<!-- Requer: componente.css -->

<!-- ── Variantes principais ───────────────────── -->

<!-- Primário (padrão, full-width, 48px) -->
<button class="kz-btn kz-btn--primary" type="button">
  <span class="kz-btn__text">Confirmar</span>
</button>

<!-- Primário com ícone -->
<button class="kz-btn kz-btn--primary" type="button">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <line x1="12" y1="5" x2="12" y2="19"/>
    <line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
  <span class="kz-btn__text">Novo pedido</span>
</button>

<!-- Secundário (outlined, full-width, 48px) -->
<button class="kz-btn kz-btn--secondary" type="button">
  <span class="kz-btn__text">Cancelar</span>
</button>

<!-- Ghost (sem borda, altura 44px) -->
<button class="kz-btn kz-btn--ghost kz-btn--auto" type="button">
  <span class="kz-btn__text">Ignorar</span>
</button>

<!-- Destrutivo — ação crítica (56px, vermelho) -->
<button class="kz-btn kz-btn--danger" type="button">
  <span class="kz-btn__text">Excluir pedido</span>
</button>

<!-- ── Botões ícone (sem texto) ──────────────── -->

<!-- Ícone — primário (48×48px) -->
<button class="kz-btn kz-btn--primary kz-btn--icon kz-btn--auto" type="button" aria-label="Adicionar">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <line x1="12" y1="5" x2="12" y2="19"/>
    <line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<!-- Ícone — secundário (48×48px) -->
<button class="kz-btn kz-btn--secondary kz-btn--icon kz-btn--auto" type="button" aria-label="Editar">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
  </svg>
</button>

<!-- Ícone — ghost/sm (44×44px) — fechar, voltar -->
<button class="kz-btn kz-btn--ghost kz-btn--icon kz-btn--sm kz-btn--auto" type="button" aria-label="Fechar">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <line x1="18" y1="6" x2="6" y2="18"/>
    <line x1="6" y1="6" x2="18" y2="18"/>
  </svg>
</button>

<!-- ── Estados ───────────────────────────────── -->

<!-- Loading — primário -->
<button class="kz-btn kz-btn--primary kz-btn--loading" type="button" aria-busy="true">
  <span class="kz-btn__text">Salvando...</span>
</button>

<!-- Loading — secundário -->
<button class="kz-btn kz-btn--secondary kz-btn--loading" type="button" aria-busy="true">
  <span class="kz-btn__text">Carregando...</span>
</button>

<!-- Desabilitado — primário -->
<button class="kz-btn kz-btn--primary" type="button" disabled>
  <span class="kz-btn__text">Confirmar</span>
</button>

<!-- Desabilitado — secundário -->
<button class="kz-btn kz-btn--secondary" type="button" disabled>
  <span class="kz-btn__text">Cancelar</span>
</button>

<!-- ── Grupo de botões (layout lado a lado) ──── -->

<div class="kz-btn-group">
  <button class="kz-btn kz-btn--secondary" type="button">
    <span class="kz-btn__text">Cancelar</span>
  </button>
  <button class="kz-btn kz-btn--primary" type="button">
    <span class="kz-btn__text">Confirmar</span>
  </button>
</div>
