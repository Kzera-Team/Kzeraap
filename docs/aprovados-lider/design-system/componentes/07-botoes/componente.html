<!-- KZERA · 07 — Botões · componente.html -->
<!-- Requer: componente.css -->

<button class="kz-btn kz-btn--primary" type="button">
  <span class="kz-btn__text">Confirmar venda</span>
</button>

<button class="kz-btn kz-btn--primary" type="button">
  <span aria-hidden="true">＋</span>
  <span class="kz-btn__text">Adicionar item</span>
</button>

<button class="kz-btn kz-btn--secondary" type="button">
  <span class="kz-btn__text">Voltar para venda</span>
</button>

<button class="kz-btn kz-btn--ghost kz-btn--auto" type="button">
  <span class="kz-btn__text">Fechar sem salvar</span>
</button>

<button class="kz-btn kz-btn--danger" type="button">
  <span class="kz-btn__text">Excluir item da venda</span>
</button>

<button class="kz-btn kz-btn--primary is-loading" type="button" aria-busy="true">
  <span class="kz-btn__spinner" aria-hidden="true"></span>
  <span class="kz-btn__text">Salvando venda</span>
</button>

<button class="kz-btn kz-btn--primary" type="button" disabled>
  <span class="kz-btn__text">Corrija os itens para concluir</span>
</button>
