<section class="ifwrap">
  <div class="ifhead">Pacote congelado</div>

  <section class="ifcard">
    <div class="ifrow">
      <div>
        <div class="iftitle">ID do pacote</div>
        <div class="ifmeta">Usado para impedir confirmação se a revisão mudar.</div>
      </div>
      <span class="ifbadge" data-detalhe-pacote>sem-pacote</span>
    </div>
  </section>

  <div class="ifhead">Artefatos previstos</div>

  <section class="ifcard">
    <div class="ifrow">
      <div>
        <div class="iftitle">Transações oficiais</div>
        <div class="ifmeta">Reservadas para a confirmação segura</div>
      </div>
      <span class="ifbadge ok" data-detalhe-transacoes>0</span>
    </div>
  </section>

  <section class="ifcard">
    <div class="ifrow">
      <div>
        <div class="iftitle">Pagamentos oficiais</div>
        <div class="ifmeta">Reservados para a confirmação segura</div>
      </div>
      <span class="ifbadge ok" data-detalhe-pagamentos>0</span>
    </div>
  </section>

  <section class="ifcard">
    <div class="ifrow">
      <div>
        <div class="iftitle">Movimentos financeiros</div>
        <div class="ifmeta">Reservados para a confirmação segura</div>
      </div>
      <span class="ifbadge ok" data-detalhe-movimentos>0</span>
    </div>
  </section>
</section>

<div class="ifbar">
  <div class="ifbar-inner">
    <button class="ifsecondary" data-ir-previa>Voltar para prévia</button>
    <button class="ifsecondary" data-ir-recuperacao>Ver recuperação</button>
  </div>
</div>
