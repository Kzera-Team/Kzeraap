<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Editar item</title>
  <style>
:root{--purple:#7B4DFF;--purple-dark:#5B2ECC;--bg:#F7F3FF;--white:#fff;--text:#120B35;--muted:#766BA8;--border:#DDD6EE;--green:#087A36;--green-bg:#DDF8E7;--green-bdr:#A8E8BF;--danger:#C62828;--danger-bdr:#FFCDD2}*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--text);min-height:100vh}.app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;background:#120B35;position:sticky;top:0;z-index:10}.hamburger{display:flex;flex-direction:column;gap:4px;width:28px;height:28px;background:none;border:none;padding:2px;cursor:pointer;justify-content:center}.hamburger span{display:block;width:18px;height:2px;border-radius:2px;background:#fff}.header-title{color:#fff;font-size:16px;font-weight:800;letter-spacing:-.02em}.btn-header{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:10px;color:#fff;font-size:13px;font-weight:800;font-family:inherit;padding:6px 12px}.screen{padding:20px 16px 60px}.section{margin-bottom:28px}.section-head{font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}.card,details{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(30,14,70,.06)}details{padding:0;overflow:hidden}summary{padding:16px;font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.details-body{padding:0 16px 16px}.field{margin-bottom:14px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px}.field-input{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--border);border-radius:13px;background:var(--bg);color:var(--text);font-size:15px;font-weight:700;font-family:inherit;display:flex;align-items:center}.field-input.filled{background:var(--white);border-color:#C4BAE4}.field-input.empty{color:#B0A8D0}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status-selector{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.status-option{height:40px;border-radius:11px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:12px;font-weight:800;font-family:inherit}.status-option.active-green{background:var(--green-bg);border-color:var(--green-bdr);color:var(--green)}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.toggle-label{font-size:13px;font-weight:700;color:var(--muted)}.toggle{width:42px;height:24px;border-radius:12px;position:relative;background:var(--green-bg);border:1px solid var(--green-bdr)}.toggle:after{content:'';position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--green)}.toggle.off{background:#F0EDF8;border:1px solid var(--border)}.toggle.off:after{right:auto;left:3px;background:#C4BAE4}.stack{display:flex;flex-direction:column;gap:10px}.btn-primary{width:100%;height:54px;border-radius:16px;border:none;background:linear-gradient(180deg,var(--purple) 0%,var(--purple-dark) 100%);color:#fff;font-size:16px;font-weight:800;font-family:inherit;box-shadow:0 8px 24px rgba(91,46,204,.35)}.btn-danger,.btn-ghost{width:100%;height:48px;border-radius:14px;background:var(--white);font-size:14px;font-weight:800;font-family:inherit}.btn-danger{border:1px solid var(--danger-bdr);color:var(--danger)}.btn-ghost{border:1px solid var(--border);color:var(--purple)}
  </style>
</head>
<body>
  <div class="app-header"><button class="hamburger" aria-label="Abrir menu"><span></span><span></span><span></span></button><div class="header-title">Editar item</div><button class="btn-header">Salvar</button></div>
  <main class="screen">
    <section class="section"><div class="section-head">Dados básicos</div><div class="card"><div class="field"><label>Nome do item</label><div class="field-input filled">Psyllium 60g</div></div><div class="field"><label>Categoria</label><div class="field-input filled">Suplementos</div></div><div class="field-row"><div class="field"><label>Preço</label><div class="field-input filled">R$ 35,00</div></div><div class="field"><label>Unidade</label><div class="field-input filled">un</div></div></div><div class="field"><label>Status</label><div class="status-selector"><button class="status-option active-green">Ativo</button><button class="status-option">Inativo</button><button class="status-option">Arquivado</button></div></div></div></section>
    <section class="section"><details><summary>Configurações avançadas</summary><div class="details-body"><div class="field"><label>SKU</label><div class="field-input empty">Opcional</div></div><div class="field"><label>Descrição curta</label><div class="field-input empty">Opcional</div></div><div class="toggle-row" style="margin-bottom:14px"><div class="toggle-label">Permite desconto</div><div class="toggle"></div></div><div class="toggle-row"><div class="toggle-label">Pode vender fracionado</div><div class="toggle off"></div></div></div></details></section>
    <section class="section"><div class="stack"><button class="btn-primary">Salvar item</button><button class="btn-danger">Inativar item</button><button class="btn-ghost">Cancelar</button></div></section>
  </main>
</body>
</html>
