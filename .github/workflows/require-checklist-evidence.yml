name: Require checklist evidence

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-checklist-evidence:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR checklist evidence
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/check-pr-checklist-evidence.mjs
