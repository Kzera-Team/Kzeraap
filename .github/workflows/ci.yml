# CI validation for Kzera desenvolvimento branch
# Runs automatically only for pull requests targeting desenvolvimento.
# Manual execution remains available through workflow_dispatch.
name: CI

on:
  pull_request:
    branches:
      - desenvolvimento
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-typecheck:
    name: Build, tests and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify build toolchain
        run: npm exec vite -- --version

      - name: Build
        run: npm exec vite -- build

      - name: Tests and typecheck
        run: npm test
