<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Perfis — Novo/Editar · Kzera</title>
  <style>
    :root {
      --purple:      #7B4DFF;
      --purple-dark: #5B2ECC;
      --bg:          #F7F3FF;
      --white:       #ffffff;
      --text:        #120B35;
      --muted:       #766BA8;
      --border:      #DDD6EE;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      background: #120B35;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .btn-back {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      padding: 2px;
    }
    .header-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .header-spacer { width: 52px; }

    .screen { padding: 20px 16px 60px; }

    .section { margin-bottom: 28px; }
    .section-head {
      font-size: 13px;
      font-weight: 900;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 10px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(30,14,70,0.06);
    }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field-input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
    }
    .field-input.filled {
      background: var(--white);
      border-color: #C4BAE4;
    }
    .field-input.empty { color: #B0A8D0; }
    .field-select {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #C4BAE4;
      border-radius: 13px;
      background: var(--white);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      appearance: none;
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
    }
    .check-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      height: 54px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(180deg, var(--purple) 0%, var(--purple-dark) 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(91,46,204,0.35);
    }
  </style>
</head>
<body>

  <div class="app-header">
    <button class="btn-back">
      <svg width="8" height="13" viewBox="0 0 8 13" fill="none">
        <path d="M7 1L1 6.5L7 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Perfis
    </button>
    <span class="header-title">Novo perfil</span>
    <div class="header-spacer"></div>
  </div>

  <div class="screen">

    <div class="section">
      <div class="section-head">Identificação</div>
      <div class="card">
        <div class="field">
          <label>Nome</label>
          <input class="field-input empty" type="text" placeholder="Nome obrigatório">
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">Contato</div>
      <div class="card">
        <div class="field">
          <label>Telefone</label>
          <input class="field-input empty" type="text" placeholder="Telefone">
        </div>
        <div class="field">
          <label>E-mail</label>
          <input class="field-input empty" type="text" placeholder="E-mail">
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">Localização</div>
      <div class="card">
        <div class="field">
          <label>Região operacional</label>
          <select class="field-select">
            <option>Selecionar…</option>
          </select>
        </div>
        <div class="field">
          <label>Bairro / Localidade</label>
          <select class="field-select">
            <option>Selecionar…</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">Relacionamento</div>
      <div class="card">
        <label class="check-row">
          <input type="checkbox">
          Conheço pessoalmente
        </label>
      </div>
    </div>

    <div class="section" style="margin-bottom: 0;">
      <button class="btn-primary">Criar perfil</button>
    </div>

  </div>

</body>
</html>
