<section class="ifwrap">
  <div class="ifhero">
    <h1>Importar transações e financeiro</h1>
    <p>Carregue os dois arquivos para começar. Nada será confirmado nesta etapa.</p>
  </div>

  <div class="ifhead">Uploads</div>

  <section class="ifcard">
    <div class="ifrow">
      <div>
        <div class="iftitle">Transações</div>
        <div class="ifmeta" data-nome-transacoes>Nenhum arquivo carregado</div>
      </div>
      <span class="ifbadge">Obrigatório</span>
    </div>
    <label class="ifupload">
      <b>Escolher arquivo de transações</b>
      <span>CSV, TSV ou TXT</span>
      <input type="file" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values,text/plain" data-file-upload-transacoes aria-label="Escolher arquivo de transações">
    </label>
  </section>

  <section class="ifcard">
    <div class="ifrow">
      <div>
        <div class="iftitle">Financeiro</div>
        <div class="ifmeta" data-nome-financeiro>Nenhum arquivo carregado</div>
      </div>
      <span class="ifbadge">Obrigatório</span>
    </div>
    <label class="ifupload">
      <b>Escolher arquivo financeiro</b>
      <span>CSV, TSV ou TXT</span>
      <input type="file" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values,text/plain" data-file-upload-financeiro aria-label="Escolher arquivo financeiro">
    </label>
  </section>
</section>

<div class="ifbar">
  <div class="ifbar-inner">
    <button class="ifprimary" data-continuar-carregamento disabled>Carregue os dois arquivos</button>
    <div class="ifnote">Nada será confirmado agora.</div>
  </div>
</div>
