<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Venda manual — vazia com perfil</title><style>:root{--p:#7B4DFF;--pd:#5B2ECC;--bg:#F7F3FF;--w:#fff;--t:#120B35;--m:#766BA8;--b:#DDD6EE}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:var(--t);min-height:100vh}.app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;background:#120B35;position:sticky;top:0;z-index:10}.hamburger{display:flex;flex-direction:column;gap:4px;width:28px;height:28px;background:none;border:0;padding:2px;justify-content:center}.hamburger span{width:18px;height:2px;border-radius:2px;background:#fff}.header-title{color:#fff;font-size:16px;font-weight:800}.spacer{width:28px}.screen{padding:20px 16px 126px}.section{margin-bottom:22px}.section-head{font-size:13px;font-weight:900;color:var(--m);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}.card{background:var(--w);border:1px solid var(--b);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(30,14,70,.06)}.compact{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px}.title{font-size:15px;font-weight:900;margin-bottom:3px}.meta{font-size:13px;font-weight:700;color:var(--m);line-height:1.38}.profile-action{border:1px solid var(--b);background:#fff;color:var(--p);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:800}.btn-add{width:100%;height:46px;border-radius:13px;border:1px dashed #C4BAE4;background:transparent;color:var(--p);font-size:14px;font-weight:800;margin-top:10px}.footer{position:fixed;left:0;right:0;bottom:0;z-index:12;background:rgba(247,243,255,.96);border-top:1px solid var(--b);padding:12px 16px 18px;box-shadow:0 -8px 26px rgba(18,8,45,.10)}.ft{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.ft span{font-size:12px;font-weight:900;color:var(--m);text-transform:uppercase;letter-spacing:.06em}.ft strong{font-size:22px;font-weight:900}.primary{width:100%;height:54px;border-radius:16px;border:0;background:linear-gradient(180deg,var(--p),var(--pd));color:#fff;font-size:16px;font-weight:800;box-shadow:0 8px 24px rgba(91,46,204,.35)}</style></head><body><div class="app-header"><button class="hamburger"><span></span><span></span><span></span></button><div class="header-title">Venda manual</div><div class="spacer"></div></div><main class="screen"><section class="section"><div class="section-head">Perfil</div><div class="card compact"><div><div class="title">A.JD · Centro</div><div class="meta">Perfil por código/apelido.</div></div><button class="profile-action">Trocar</button></div></section><section class="section"><div class="section-head">Itens</div><div class="card"><div class="title">Nenhum item adicionado</div><div class="meta">Adicione um item para iniciar a venda.</div><button class="btn-add">+ Adicionar item</button></div></section></main><footer class="footer"><div class="ft"><span>Total</span><strong>R$ 0,00</strong></div><button class="primary">Adicionar item</button></footer></body></html>
