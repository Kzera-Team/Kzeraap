<section class="ifwrap" aria-hidden="true">
  <section class="ifcard ifgreen">
    <div class="iftitle">Pronto para confirmar vendas históricas.</div>
    <p>Prévia congelada. Isso não mexe no estoque.</p>
  </section>
</section>

<div class="ifsheet-backdrop"></div>
<section class="ifsheet" role="dialog" aria-modal="true" aria-label="Confirmar histórico financeiro">
  <div class="ifsheet-inner">
    <div class="ifsheet-handle"></div>
    <div class="iftitle">Confirmar histórico financeiro</div>
    <p class="ifmuted">Essa ação cria vendas, pagamentos e movimentos financeiros a partir da prévia congelada. Nada será recalculado agora.</p>

    <section class="ifcard">
      <div class="ifrow">
        <div>Vendas históricas</div>
        <strong data-confirmacao-transacoes>0</strong>
      </div>
      <div class="ifrow">
        <div>Pagamentos</div>
        <strong data-confirmacao-pagamentos>0</strong>
      </div>
      <div class="ifrow">
        <div>Estoque</div>
        <strong>Não mexe</strong>
      </div>
    </section>

    <button class="ifprimary" data-confirmar-importacao>Confirmar com segurança</button>
    <button class="ifsecondary" data-cancelar-confirmacao>Cancelar</button>
  </div>
</section>
