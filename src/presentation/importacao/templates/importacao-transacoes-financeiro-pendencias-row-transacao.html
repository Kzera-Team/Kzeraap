<section class="ifissue" data-registro-row data-registro-id="{{id}}" data-tipo="transacao">
  <div class="ifrow">
    <div>
      <div class="iftitle">{{titulo}}</div>
      <div class="ifmeta">{{meta}}</div>
    </div>
    <span class="ifbadge {{badgeClass}}">{{status}}</span>
  </div>
  <div class="ifbar-inner">
    <button class="ifsecondary" data-ignorar-registro data-registro-id="{{id}}" data-tipo="transacao" {{disabled}}>Ignorar</button>
    <button class="ifsecondary" data-marcar-revisao-registro data-registro-id="{{id}}" data-tipo="transacao">Revisão</button>
  </div>
</section>
