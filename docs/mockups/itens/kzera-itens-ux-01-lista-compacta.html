<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Itens</title>
  <style>
:root {
  --purple: #7B4DFF;
  --purple-dark: #5B2ECC;
  --bg: #F7F3FF;
  --white: #ffffff;
  --text: #120B35;
  --muted: #766BA8;
  --border: #DDD6EE;
  --green: #087A36;
  --green-bg: #DDF8E7;
  --green-bdr: #A8E8BF;
  --danger: #C62828;
  --danger-bg: #FFF5F5;
  --danger-bdr: #FFCDD2;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  min-height: 100vh;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 12px;
  background: #120B35;
  position: sticky;
  top: 0;
  z-index: 10;
}

.hamburger {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 28px;
  height: 28px;
  background: none;
  border: none;
  padding: 2px;
  cursor: pointer;
  justify-content: center;
}

.hamburger span {
  display: block;
  width: 18px;
  height: 2px;
  border-radius: 2px;
  background: #fff;
}

.header-title {
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.spacer {
  width: 28px;
  height: 28px;
}

.btn-header {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 10px;
  color: #fff;
  font-size: 13px;
  font-weight: 800;
  font-family: inherit;
  padding: 6px 12px;
  cursor: pointer;
}

.screen {
  padding: 20px 16px 60px;
}

.section {
  margin-bottom: 28px;
}

.section-head {
  font-size: 13px;
  font-weight: 900;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 10px;
}

.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 2px 10px rgba(30,14,70,0.06);
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.field {
  margin-bottom: 14px;
}

.field:last-child {
  margin-bottom: 0;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 800;
  color: var(--muted);
  margin-bottom: 6px;
}

.field-input {
  width: 100%;
  min-height: 48px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  display: flex;
  align-items: center;
}

.field-input.filled {
  background: var(--white);
  border-color: #C4BAE4;
}

.field-input.empty {
  color: #B0A8D0;
}

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn-primary {
  width: 100%;
  height: 54px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(180deg, var(--purple) 0%, var(--purple-dark) 100%);
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(91,46,204,0.35);
}

.btn-ghost {
  width: 100%;
  height: 48px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--purple);
  font-size: 14px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
}

.btn-danger {
  width: 100%;
  height: 48px;
  border-radius: 14px;
  border: 1px solid var(--danger-bdr);
  background: var(--white);
  color: var(--danger);
  font-size: 14px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
}

.btn-add {
  width: 100%;
  height: 46px;
  border-radius: 13px;
  border: 1px dashed #C4BAE4;
  background: transparent;
  color: var(--purple);
  font-size: 14px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.filter-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.filter-btn {
  height: 40px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
}

.filter-btn.active {
  background: var(--green-bg);
  border-color: var(--green-bdr);
  color: var(--green);
}

.item-card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 14px 14px;
}

.item-main {
  min-width: 0;
}

.item-line {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.item-name {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: -0.02em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item-meta {
  margin-top: 4px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item-price {
  margin-top: 4px;
  font-size: 15px;
  font-weight: 900;
  color: var(--text);
}

.badge {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 900;
  flex-shrink: 0;
}

.badge.green {
  color: var(--green);
  background: var(--green-bg);
  border: 1px solid var(--green-bdr);
}

.badge.muted {
  color: #4A3880;
  background: #F0EDF8;
  border: 1px solid #C4BAE4;
}

.badge.danger {
  color: var(--danger);
  background: var(--danger-bg);
  border: 1px solid var(--danger-bdr);
}

.action-menu {
  position: relative;
}

.action-trigger {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--purple);
  font-size: 20px;
  font-weight: 900;
  line-height: 1;
  font-family: inherit;
  cursor: pointer;
}

.action-panel {
  position: absolute;
  right: 0;
  top: 40px;
  width: 142px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 10px 28px rgba(18,8,45,0.16);
  padding: 6px;
  z-index: 9;
}

.action-item {
  width: 100%;
  height: 36px;
  border: 0;
  background: transparent;
  border-radius: 10px;
  color: var(--text);
  font-size: 13px;
  font-weight: 800;
  font-family: inherit;
  text-align: left;
  padding: 0 10px;
}

.action-item.danger {
  color: var(--danger);
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.toggle-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}

.toggle {
  width: 42px;
  height: 24px;
  border-radius: 12px;
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
  background: var(--green-bg);
  border: 1px solid var(--green-bdr);
}

.toggle::after {
  content: '';
  position: absolute;
  top: 3px;
  right: 3px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--green);
}

.toggle.off {
  background: #F0EDF8;
  border: 1px solid var(--border);
}

.toggle.off::after {
  right: auto;
  left: 3px;
  background: #C4BAE4;
}

.status-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.status-option {
  height: 40px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.status-option.active-green {
  background: var(--green-bg);
  border-color: var(--green-bdr);
  color: var(--green);
}

.status-option.active-muted {
  background: #F0EDF8;
  border-color: #C4BAE4;
  color: #4A3880;
}

.empty-state {
  text-align: center;
  padding: 24px 16px;
}

.empty-title {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}

.empty-text {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.45;
  color: var(--muted);
  margin-bottom: 16px;
}

.details-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.detail-line {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 15px;
  font-weight: 700;
}

.detail-line span:first-child {
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}

details {
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--white);
  box-shadow: 0 2px 10px rgba(30,14,70,0.06);
  overflow: hidden;
}

summary {
  padding: 16px;
  font-size: 13px;
  font-weight: 900;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  cursor: pointer;
}

.details-body {
  padding: 0 16px 16px;
}
</style>
</head>
<body>
  <div class="app-header">
    <button class="hamburger" aria-label="Abrir menu"><span></span><span></span><span></span></button>
    <div class="header-title">Itens</div>
    <button class="btn-header">Novo</button>
  </div>
  <main class="screen">

    <section class="section">
      <div class="card">
        <div class="field" style="margin-bottom: 12px;">
          <div class="field-input empty">Buscar item...</div>
        </div>
        <div class="filter-row">
          <button class="filter-btn active">Todos</button>
          <button class="filter-btn">Ativos</button>
          <button class="filter-btn">Inativos</button>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">Lista de itens</div>
      <div class="stack">
        
        <article class="card item-card">
          <div class="item-main">
            <div class="item-line">
              <div class="item-name">Psyllium 60g</div>
              <span class="badge green">Ativo</span>
            </div>
            <div class="item-meta">Suplementos · un</div>
            <div class="item-price">R$ 35,00</div>
          </div>
          <div class="action-menu">
            <button class="action-trigger" aria-label="Ações do item">⋯</button>
          </div>
        </article>
        
        <article class="card item-card">
          <div class="item-main">
            <div class="item-line">
              <div class="item-name">Glicerina 30ml</div>
              <span class="badge green">Ativo</span>
            </div>
            <div class="item-meta">Utilidades · un</div>
            <div class="item-price">R$ 12,00</div>
          </div>
          <div class="action-menu">
            <button class="action-trigger" aria-label="Ações do item">⋯</button>
          <div class="action-panel">
            <button class="action-item">Editar</button>
            <button class="action-item danger">Inativar</button>
          </div>
          </div>
        </article>
        
        <article class="card item-card">
          <div class="item-main">
            <div class="item-line">
              <div class="item-name">Kit Vitalidade</div>
              <span class="badge muted">Inativo</span>
            </div>
            <div class="item-meta">Combos · un</div>
            <div class="item-price">R$ 120,00</div>
          </div>
          <div class="action-menu">
            <button class="action-trigger" aria-label="Ações do item">⋯</button>
          </div>
        </article>
      </div>
      <button class="btn-add">+ Criar item</button>
    </section>

  </main>
</body>
</html>
