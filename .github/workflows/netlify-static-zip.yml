name: Gerar ZIP Netlify

on:
  workflow_dispatch:

jobs:
  build-netlify-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências com devDependencies
        run: npm ci --include=dev

      - name: Garantir Vite disponível
        run: npm install vite@^8.0.16 --no-save --include=dev

      - name: Gerar build
        run: npx vite build

      - name: Criar ZIP pronto para Netlify Drop
        run: |
          test -d dist
          cd dist
          zip -r ../Kzera-Netlify-Static-Deploy-${{ github.sha }}.zip .

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Kzera-Netlify-Static-Deploy
          path: Kzera-Netlify-Static-Deploy-${{ github.sha }}.zip
          if-no-files-found: error
