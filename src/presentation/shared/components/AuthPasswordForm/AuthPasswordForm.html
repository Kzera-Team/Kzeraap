<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-icon" data-auth-password-app-initial></div>
      <div><h1 data-auth-password-app-name></h1></div>
    </div>
    <div class="toast toast-error" data-testid="auth-error" data-auth-password-error hidden></div>
    <form class="auth-form" data-auth-password-form>
      <h2 data-auth-password-title></h2>
      <p data-auth-password-description></p>
      <label class="auth-field password-field">
        <span data-auth-password-input-label></span>
        <span class="password-control">
          <input type="password" required data-auth-password-input />
          <button type="button" class="password-toggle" aria-label="Mostrar senha" data-auth-password-toggle>👁</button>
        </span>
      </label>
      <button type="submit" data-auth-password-submit></button>
    </form>
    <footer class="auth-version" data-testid="app-version" data-auth-password-version></footer>
  </div>
</section>
