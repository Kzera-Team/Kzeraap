name: Gerar ZIP Netlify Seguro

on:
  workflow_dispatch:
  push:
    branches:
      - claude/file-upload-project-22m8hs

jobs:
  build-netlify-zip-safe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ler versão do pacote
        run: echo "APP_VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: npm install --include=dev

      - name: Instalar Vite localmente
        run: npm install vite@^8.0.16 --no-save --include=dev

      - name: Gerar build
        run: npx vite build

      - name: Validar build
        run: |
          test -d dist
          test -f dist/index.html
          test -d dist/assets

      - name: Garantir arquivos Netlify
        run: |
          printf '/* /index.html 200\n' > dist/_redirects
          cp netlify.toml dist/netlify.toml
          test -f dist/_redirects
          test -f dist/netlify.toml

      - name: Criar ZIP Netlify Drop
        run: |
          ZIP_NAME="Kzera-Netlify-Static-Deploy-v${APP_VERSION}.zip"
          cd dist
          zip -r "../${ZIP_NAME}" .
          cd ..
          test -f "${ZIP_NAME}"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Kzera-Netlify-Static-Deploy-v${{ env.APP_VERSION }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
