name: CI

on:
  pull_request:
    branches:
      - desenvolvimento
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-typecheck:
    name: Build, tests and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          set -o pipefail
          echo "Starting npm install" | tee install.log
          npm config set registry https://registry.npmjs.org/
          npm install --include=dev --registry=https://registry.npmjs.org/ 2>&1 | tee -a install.log

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log
          path: install.log

      - name: Verify build toolchain
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          node --version
          npm --version
          npm config get registry
          npm exec vite -- --version

      - name: Build
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          set -o pipefail
          npm exec vite -- build 2>&1 | tee build.log

      - name: Tests and typecheck
        run: npm test

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
