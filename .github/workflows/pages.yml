name: Deploy ambiente teste

on:
  push:
    branches:
      - desenvolvimento
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install --include=dev --registry=https://registry.npmjs.org/

      - name: Build
        run: npm exec vite -- build

      - name: Write debug manifest
        run: |
          echo "run_id=${GITHUB_RUN_ID}" > dist/kzera-debug-manifest.txt
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}" >> dist/kzera-debug-manifest.txt
          echo "sha=${GITHUB_SHA}" >> dist/kzera-debug-manifest.txt
          echo "ref=${GITHUB_REF}" >> dist/kzera-debug-manifest.txt
          echo "artifact_name=dist-debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> dist/kzera-debug-manifest.txt
          printf '{\n' > dist/latest-run.json
          printf '  "repository": "jjjtestejoao-ui/Kzeraap",\n' >> dist/latest-run.json
          printf '  "workflow": "Deploy ambiente teste",\n' >> dist/latest-run.json
          printf '  "run_id": "%s",\n' "${GITHUB_RUN_ID}" >> dist/latest-run.json
          printf '  "run_attempt": "%s",\n' "${GITHUB_RUN_ATTEMPT}" >> dist/latest-run.json
          printf '  "sha": "%s",\n' "${GITHUB_SHA}" >> dist/latest-run.json
          printf '  "ref": "%s",\n' "${GITHUB_REF}" >> dist/latest-run.json
          printf '  "artifact_name": "dist-debug-%s-%s",\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> dist/latest-run.json
          printf '  "page_url": "https://jjjtestejoao-ui.github.io/Kzeraap/"\n' >> dist/latest-run.json
          printf '}\n' >> dist/latest-run.json

      - name: Upload dist debug artifact
        id: upload_dist_debug
        uses: actions/upload-artifact@v4
        with:
          name: dist-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Write GitHub Actions summary
        run: |
          echo "## Kzera deploy debug" >> "$GITHUB_STEP_SUMMARY"
          echo "Run ID: ${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "Run attempt: ${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact name: dist-debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact ID: ${{ steps.upload_dist_debug.outputs.artifact-id }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
