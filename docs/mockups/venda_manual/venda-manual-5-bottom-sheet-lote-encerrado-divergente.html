ity:.35;pointer-events:none;filter:blur(1px)}.overlay{position:fixed;inset:0;background:rgba(8,4,22,.5);z-index:20}.bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-radius:28px 28px 0 0;padding:12px 16px 40px;box-shadow:0 -12px 48px rgba(18,8,45,.3);z-index:30}.sheet-handle{width:40px;height:4px;border-radius:2px;background:#C4BAE4;margin:0 auto 20px}.sheet-title{font-size:20px;font-weight:900;letter-spacing:-.3px;margin-bottom:4px}.sheet-desc{font-size:13px;font-weight:700;color:var(--m);line-height:1.5;margin-bottom:20px}.option-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}.option-btn{width:100%;padding:16px;border-radius:16px;border:2px solid var(--b);background:#fff;text-align:left;font-family:inherit;display:flex;gap:14px}.option-btn.selected{border-color:var(--p)}.option-btn.disabled{opacity:.58;background:#FBF9FF}.option-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--b);flex-shrink:0}.selected .option-radio{border-color:var(--p);background:var(--p);box-shadow:inset 0 0 0 6px #fff}.option-label{font-size:15px;font-weight:800;color:var(--t);margin-bottom:2px}.option-sublabel{font-size:12px;font-weight:700;color:var(--m);line-height:1.35}.primary{width:100%;height:54px;border-radius:16px;border:0;background:linear-gradient(180deg,var(--p),var(--pd));color:#fff;font-size:16px;font-weight:800}.cancel{width:100%;height:44px;border:0;background:transparent;color:var(--p);font-size:14px;font-weight:800}</style></head><body><div class="bg-content"><div class="app-header"><button class="hamburger"><span></span><span></span><span></span></button><div class="header-title">Venda manual</div><div class="spacer"></div></div><main class="screen"><section class="section"><div class="section-head">Perfil</div><div class="card compact"><div><div class="title">A.JD · Centro</div><div class="meta">Perfil por código/apelido.</div></div><button class="profile-action">Trocar</button></div></section><section class="section"><div class="section-head">Itens</div><div class="card"><div class="item-row"><div><div class="title">Psyllium</div><div class="meta">Lote A23 · Variação 60g</div><div class="meta">Qtd: 0,5 g · Disp: 12,5 g</div></div><b>R$ 35,00</b></div><span class="badge">Estoque OK</span></div><button class="btn-add">+ Adicionar item</button></section></main></div><div class="overlay"></div><div class="bottom-sheet"><div class="sheet-handle"></div><div class="sheet-title">Selecionar lote</div><div class="sheet-desc">Lotes encerrados ou divergentes ficam bloqueados no MVP.</div><div class="option-list"><button class="option-btn selected"><span class="option-radio"></span><span><div class="option-label">Lote A23</div><div class="option-sublabel">Disponível: 12,5 g · Preço sugerido: R$ 70/g</div></span></button><button class="option-btn disabled" disabled><span class="option-radio"></span><span><div class="option-label">Lote B11</div><div class="option-sublabel">Encerrado · Não disponível para venda</div></span></button><button class="option-btn disabled" disabled><span class="option-radio"></span><span><div class="option-label">Lote C07</div><div class="option-sublabel">Divergente · Corrigir no estoque antes de vender</div></span></button></div><button class="primary">Usar lote selecionado</button><button class="cancel">Cancelar</button></div><script>document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});</script></body></html>
