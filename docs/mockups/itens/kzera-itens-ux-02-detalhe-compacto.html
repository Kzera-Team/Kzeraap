<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Item</title>
  <style>
:root{--purple:#7B4DFF;--purple-dark:#5B2ECC;--bg:#F7F3FF;--white:#fff;--text:#120B35;--muted:#766BA8;--border:#DDD6EE;--green:#087A36;--green-bg:#DDF8E7;--green-bdr:#A8E8BF;--danger:#C62828;--danger-bg:#FFF5F5;--danger-bdr:#FFCDD2}*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--text);min-height:100vh}.app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;background:#120B35;position:sticky;top:0;z-index:10}.hamburger{display:flex;flex-direction:column;gap:4px;width:28px;height:28px;background:none;border:none;padding:2px;cursor:pointer;justify-content:center}.hamburger span{display:block;width:18px;height:2px;border-radius:2px;background:#fff}.header-title{color:#fff;font-size:16px;font-weight:800;letter-spacing:-.02em}.btn-header{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:10px;color:#fff;font-size:13px;font-weight:800;font-family:inherit;padding:6px 12px}.screen{padding:20px 16px 60px}.section{margin-bottom:28px}.section-head{font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}.card{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(30,14,70,.06)}.item-card{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px}.item-main{min-width:0}.item-line{display:flex;align-items:center;gap:8px;min-width:0}.item-name{font-size:15px;font-weight:900;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-meta{margin-top:4px;font-size:13px;font-weight:700;color:var(--muted);line-height:1.25}.item-price{margin-top:4px;font-size:15px;font-weight:900;color:var(--text)}.badge{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:900;flex-shrink:0}.badge.green{color:var(--green);background:var(--green-bg);border:1px solid var(--green-bdr)}.action-trigger{width:34px;height:34px;border-radius:12px;border:1px solid var(--border);background:var(--white);color:var(--purple);font-size:20px;font-weight:900;line-height:1;font-family:inherit}.details-grid{display:flex;flex-direction:column;gap:12px}.detail-line{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-weight:700}.detail-line span:first-child{color:var(--muted);font-size:13px;font-weight:800}.stack{display:flex;flex-direction:column;gap:10px}.btn-primary{width:100%;height:54px;border-radius:16px;border:none;background:linear-gradient(180deg,var(--purple) 0%,var(--purple-dark) 100%);color:#fff;font-size:16px;font-weight:800;font-family:inherit;box-shadow:0 8px 24px rgba(91,46,204,.35)}.btn-danger{width:100%;height:48px;border-radius:14px;border:1px solid var(--danger-bdr);background:var(--white);color:var(--danger);font-size:14px;font-weight:800;font-family:inherit}
  </style>
</head>
<body>
  <div class="app-header"><button class="hamburger" aria-label="Abrir menu"><span></span><span></span><span></span></button><div class="header-title">Item</div><button class="btn-header">Editar</button></div>
  <main class="screen">
    <section class="section"><div class="card item-card"><div class="item-main"><div class="item-line"><div class="item-name">Psyllium 60g</div><span class="badge green">Ativo</span></div><div class="item-meta">Suplementos · un</div><div class="item-price">R$ 35,00</div></div><button class="action-trigger" aria-label="Ações do item">⋯</button></div></section>
    <section class="section"><div class="section-head">Resumo</div><div class="card details-grid"><div class="detail-line"><span>Categoria</span><strong>Suplementos</strong></div><div class="detail-line"><span>Preço</span><strong>R$ 35,00</strong></div><div class="detail-line"><span>Unidade</span><strong>un</strong></div><div class="detail-line"><span>Status</span><strong>Ativo</strong></div></div></section>
    <section class="section"><div class="section-head">Ações</div><div class="stack"><button class="btn-primary">Editar item</button><button class="btn-danger">Inativar item</button></div></section>
  </main>
</body>
</html>
