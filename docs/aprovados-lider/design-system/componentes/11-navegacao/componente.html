<!-- KZERA · 11 — Navegação · componente.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview — Navegação KZERA</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --kz-light-bg:          #F4F0FC;
  --kz-light-surface:     #fff;
  --kz-light-text:        #120B35;
  --kz-light-muted:       #6B5FA0;
  --kz-light-accent:      #7B4DFF;
  --kz-light-border:      #DDD4F3;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-6:  24px;
  --radius-3: 12px;
  --radius-4: 16px;
  --shadow-1: 0 1px 4px rgba(18,11,53,.07);
  --shadow-3: 0 8px 32px rgba(18,11,53,.16);
  --t-xs:   0.75rem;
  --t-base: 0.875rem;
  --t-md:   1rem;
  --t-xl:   1.25rem;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #1A1532;
  display: flex;
  gap: 32px;
  justify-content: center;
  align-items: flex-start;
  padding: 32px 24px 48px;
  flex-wrap: wrap;
}

/* ── Phone Frame ── */
.phone {
  width: 320px;
  border-radius: 44px;
  border: 6px solid #2E2B44;
  box-shadow: 0 0 0 1px #3D3860, 0 32px 64px rgba(0,0,0,.6);
  background: radial-gradient(circle at top, #241044 0%, #16072F 48%, #0D061D 100%);
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
}

.phone-label {
  text-align: center;
  margin-top: 12px;
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: rgba(255,255,255,.45);
}

/* Status bar */
.status-bar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 14px 22px 4px;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}
.status-bar-icons {
  display: flex;
  gap: 5px;
  align-items: center;
  justify-content: flex-end;
  font-size: 10px;
}

/* Screen (painel branco) */
.screen {
  border-radius: 20px 20px 0 0;
  background: linear-gradient(180deg, #FBF9FF 0%, #F7F3FF 100%);
  border: 1px solid #DDD4F3;
  border-bottom: none;
  min-height: 520px;
  position: relative;
  overflow: hidden;
}

/* Home indicator */
.home-indicator {
  width: 134px;
  height: 5px;
  background: #fff;
  border-radius: 3px;
  opacity: .3;
  margin: 8px auto;
}

/* ── Componentes de navegação (inline, sem arquivo externo) ── */

/* Menu button */
.kz-nav-menu-btn {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(18,11,53,.82);
  color: #fff;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 8px 32px rgba(18,11,53,.16);
}

/* Screen header */
.kz-screen-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  min-height: 56px;
  background: #F4F0FC;
  border-bottom: 1px solid #DDD4F3;
}
.kz-screen-header-title {
  flex: 1;
  font-size: 1.1rem;
  font-weight: 900;
  letter-spacing: -.03em;
  color: #120B35;
  line-height: 1.1;
}

/* Back button */
.kz-btn-back {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid #DDD4F3;
  background: #fff;
  color: #120B35;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(18,11,53,.07);
  flex-shrink: 0;
}

/* Screen content placeholder */
.screen-content {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.placeholder-row {
  height: 52px;
  border-radius: 12px;
  background: #EDE8F8;
  opacity: .5;
}
.placeholder-row:nth-child(2) { opacity: .35; height: 44px; }
.placeholder-row:nth-child(3) { opacity: .22; height: 44px; }

/* Drawer panel */
.kz-nav-drawer {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 80;
  width: 220px;
  height: 100%;
  padding: 24px 20px;
  background: rgba(18,11,53,.98);
  color: #fff;
  display: flex;
  flex-direction: column;
}
.kz-nav-drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.kz-nav-drawer-title {
  font-size: 0.9375rem;
  font-weight: 900;
}
.kz-nav-drawer-close {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,.10);
  color: #fff;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.kz-nav-drawer-nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}
.kz-nav-drawer-item {
  width: 100%;
  text-align: left;
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,.07);
  color: #fff;
  font-size: 0.8125rem;
  font-weight: 800;
  cursor: pointer;
}
.kz-nav-drawer-item.is-active { background: rgba(255,255,255,.15); }
.kz-nav-drawer-footer {
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,.10);
}
.kz-nav-version {
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: .08em;
  color: rgba(255,255,255,.40);
}

/* Backdrop (visual only) */
.kz-nav-drawer-backdrop {
  position: absolute;
  top: 0; left: 220px; right: 0; bottom: 0;
  background: rgba(0,0,0,.34);
}
</style>
</head>
<body>

<!-- Estado 1: Tela com menu button + screen header -->
<div>
  <div class="phone">
    <div class="status-bar">
      <span></span>
      <span style="font-weight:800;">9:41</span>
      <div class="status-bar-icons">
        <span>●●●</span>
        <span>WiFi</span>
        <span>🔋</span>
      </div>
    </div>
    <div class="screen">
      <div class="kz-screen-header">
        <button class="kz-nav-menu-btn" aria-label="Menu" style="position:static;box-shadow:none;">
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="0" y1="1" x2="18" y2="1"/><line x1="0" y1="7" x2="18" y2="7"/><line x1="0" y1="13" x2="18" y2="13"/>
          </svg>
        </button>
        <span class="kz-screen-header-title">Perfis</span>
      </div>
      <div class="screen-content">
        <div class="placeholder-row"></div>
        <div class="placeholder-row"></div>
        <div class="placeholder-row"></div>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
  <div class="phone-label">Header + Menu Button</div>
</div>

<!-- Estado 2: Drawer aberto -->
<div>
  <div class="phone">
    <div class="status-bar">
      <span></span>
      <span style="font-weight:800;">9:41</span>
      <div class="status-bar-icons">
        <span>●●●</span>
        <span>WiFi</span>
        <span>🔋</span>
      </div>
    </div>
    <div class="screen" style="overflow:hidden;">
      <div class="kz-screen-header" style="filter:blur(1px);opacity:.4;">
        <button class="kz-nav-menu-btn" aria-label="Menu" style="position:static;box-shadow:none;">
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="0" y1="1" x2="18" y2="1"/><line x1="0" y1="7" x2="18" y2="7"/><line x1="0" y1="13" x2="18" y2="13"/>
          </svg>
        </button>
        <span class="kz-screen-header-title">Perfis</span>
      </div>
      <div class="screen-content" style="filter:blur(1px);opacity:.4;">
        <div class="placeholder-row"></div>
        <div class="placeholder-row"></div>
      </div>
      <!-- Drawer aberto -->
      <div class="kz-nav-drawer-backdrop"></div>
      <div class="kz-nav-drawer">
        <div class="kz-nav-drawer-header">
          <span class="kz-nav-drawer-title">KZERA</span>
          <button class="kz-nav-drawer-close" aria-label="Fechar">×</button>
        </div>
        <nav class="kz-nav-drawer-nav">
          <button class="kz-nav-drawer-item is-active">Perfis</button>
          <button class="kz-nav-drawer-item">Itens</button>
          <button class="kz-nav-drawer-item">Transações</button>
          <button class="kz-nav-drawer-item">Configurações</button>
          <button class="kz-nav-drawer-item" style="margin-top:4px;color:rgba(255,255,255,.55);">Sair</button>
        </nav>
        <div class="kz-nav-drawer-footer">
          <span class="kz-nav-version">v0.20.0</span>
        </div>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
  <div class="phone-label">Drawer Aberto</div>
</div>

<!-- Estado 3: Back button -->
<div>
  <div class="phone">
    <div class="status-bar">
      <span></span>
      <span style="font-weight:800;">9:41</span>
      <div class="status-bar-icons">
        <span>●●●</span>
        <span>WiFi</span>
        <span>🔋</span>
      </div>
    </div>
    <div class="screen">
      <div class="kz-screen-header">
        <button class="kz-btn-back" aria-label="Voltar">
          <svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9,1 1,8 9,15"/>
          </svg>
        </button>
        <span class="kz-screen-header-title">Detalhe do Perfil</span>
      </div>
      <div class="screen-content">
        <div class="placeholder-row"></div>
        <div class="placeholder-row"></div>
        <div class="placeholder-row"></div>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
  <div class="phone-label">Back Button</div>
</div>

</body>
</html>
