name: Test Evidence

on:
  pull_request:
    branches:
      - desenvolvimento

jobs:
  test-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require real app test evidence
        run: node scripts/test-evidence-check.mjs
