<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=390, initial-scale=1" />
<title>Mockup v2 — Tela de Perfis · Ana</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F4F0FC;
    max-width: 390px;
    min-height: 100vh;
  }

  .menu-button {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(20,20,32,.82);
    color: #fff;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.22);
  }

  .screen-header {
    padding: 16px 16px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .screen-header h1 {
    flex: 1;
    font-size: 28px;
    font-weight: 950;
    letter-spacing: -0.5px;
    color: #120B35;
    line-height: 1;
  }
  .btn-novo {
    flex-shrink: 0;
    padding: 0 16px;
    height: 40px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(180deg, #7B4DFF 0%, #5B2ECC 100%);
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(91,46,204,0.4);
    white-space: nowrap;
  }

  .search-wrap {
    margin: 4px 16px 0;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    height: 50px;
    padding: 0 16px 0 46px;
    border: 1.5px solid #DDD4F3;
    border-radius: 16px;
    background: #fff;
    font-size: 16px;
    font-weight: 600;
    color: #120B35;
    outline: none;
    box-shadow: 0 2px 8px rgba(30,14,70,0.05);
  }
  .search-wrap input::placeholder { color: #A89FCC; }
  .search-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 17px;
    pointer-events: none;
  }

  .tabs {
    display: flex;
    padding: 12px 16px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 750;
    color: #9B8FC8;
    background: none;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active {
    color: #5B2ECC;
    font-weight: 900;
    border-bottom: 2.5px solid #7B4DFF;
  }

  .list-section { padding: 14px 16px 0; }
  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .list-header h2 { font-size: 17px; font-weight: 900; color: #120B35; letter-spacing: -0.3px; }
  .btn-salvar {
    font-size: 13px;
    font-weight: 800;
    color: #5B2ECC;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .perfil-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 8px;
    border: 1.5px solid #E8E2F7;
    box-shadow: 0 2px 8px rgba(30,14,70,0.05);
    cursor: pointer;
  }
  .card-name {
    font-size: 16px;
    font-weight: 800;
    color: #120B35;
    letter-spacing: -0.2px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 12px;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }
  .badge.ativo     { background: #DDF8E7; color: #087A36; border: 1px solid #A8E8BF; }
  .badge.pendente  { background: #FFF8E6; color: #92400E; border: 1px solid rgba(194,120,3,.35); }
  .badge.arquivado { background: #F0EDF9; color: #9B8FC8; border: 1px solid #DDD4F3; }
</style>
</head>
<body>

  <div class="screen-header">
    <button class="menu-button" aria-label="Abrir menu">☰</button>
    <h1>Perfis</h1>
    <button class="btn-novo">+ Perfil</button>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Buscar por nome…" />
  </div>

  <div class="tabs">
    <button class="tab active">Lista</button>
    <button class="tab">Resumo</button>
    <button class="tab">Histórico</button>
    <button class="tab">Duplicidades</button>
  </div>

  <div class="list-section">
    <div class="list-header">
      <h2>Perfis cadastrados</h2>
      <button class="btn-salvar">⇩ Salvar lista</button>
    </div>

    <div class="perfil-card">
      <span class="card-name">Maria Santos</span>
      <span class="badge ativo">Ativo</span>
    </div>

    <div class="perfil-card">
      <span class="card-name">João Lima</span>
      <span class="badge pendente">Pendente</span>
    </div>

    <div class="perfil-card">
      <span class="card-name">Ana Costa</span>
      <span class="badge arquivado">Arquivado</span>
    </div>

  </div>

</body>
</html>
