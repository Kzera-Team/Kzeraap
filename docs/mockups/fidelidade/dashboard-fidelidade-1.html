<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Fidelidade — Kzera</title>
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --purple:      #7B4DFF;
  --purple-dark: #5B2ECC;
  --bg:          #F7F3FF;
  --white:       #ffffff;
  --text:        #120B35;
  --muted:       #766BA8;
  --border:      #DDD6EE;
  --green:       #087A36;
  --green-bg:    #DDF8E7;
  --green-bdr:   #A8E8BF;
}

body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  max-width: 414px;
  margin: 0 auto;
  min-height: 100vh;
  color: var(--text);
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 12px;
  background: #120B35;
  position: sticky;
  top: 0;
  z-index: 10;
}
.hamburger { display: flex; flex-direction: column; gap: 4px; width: 28px; height: 28px; background: none; border: none; padding: 2px; cursor: pointer; justify-content: center; }
.hamburger span { display: block; width: 18px; height: 2px; border-radius: 2px; background: #fff; }
.app-header h1 { color: #fff; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.spacer { width: 28px; }

.screen { padding: 24px 16px 60px; }

/* Stat cards */
.stat-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 32px;
}

.stat-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px 16px;
  box-shadow: 0 2px 10px rgba(30,14,70,0.06);
}

.stat-label {
  font-size: 12px;
  font-weight: 800;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
  line-height: 1.3;
}

.stat-value {
  font-size: 40px;
  font-weight: 900;
  letter-spacing: -0.03em;
  line-height: 1;
}

.stat-card.has-card .stat-value  { color: var(--green); }
.stat-card.no-card .stat-value   { color: #B0A8D0; }

.stat-card.has-card {
  border-color: var(--green-bdr);
  background: var(--green-bg);
}

/* Actions */
.btn-primary {
  width: 100%;
  height: 54px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(180deg, var(--purple) 0%, var(--purple-dark) 100%);
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(91,46,204,0.35);
}

</style>
</head>
<body>

<div class="app-header">
  <button class="hamburger"><span></span><span></span><span></span></button>
  <h1>Dashboard Fidelidade</h1>
  <div class="spacer"></div>
</div>

<div class="screen">

  <div class="stat-row">
    <div class="stat-card has-card">
      <div class="stat-label">Com cartão gerado</div>
      <div class="stat-value">142</div>
    </div>
    <div class="stat-card no-card">
      <div class="stat-label">Sem cartão</div>
      <div class="stat-value">38</div>
    </div>
  </div>

  <button class="btn-primary">Regerar cartões</button>

</div>

</body>
</html>
